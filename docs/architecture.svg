<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Architecture of event-loop-tax"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="480.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">The same work, four ways of waiting for it</text><rect x="24" y="150" width="178" height="76" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="113.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">one unit of work</text><text x="113.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">5ms, identical in</text><text x="113.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">all four shapes</text><rect x="262" y="62" width="206" height="48" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="365.0" y="82" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">async_awaited</text><text x="365.0" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">yields</text><line x1="202" y1="185" x2="262" y2="86" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="262" y="124" width="206" height="48" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="365.0" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">async_blocking</text><text x="365.0" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">holds the loop</text><line x1="202" y1="185" x2="262" y2="148" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="262" y="186" width="206" height="48" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="365.0" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">sync_threadpool</text><text x="365.0" y="224" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">worker thread</text><line x1="202" y1="185" x2="262" y2="210" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="262" y="248" width="206" height="48" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="365.0" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">async_offloaded</text><text x="365.0" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">worker thread</text><line x1="202" y1="185" x2="262" y2="272" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="536" y="72" width="180" height="60" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="626.0" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">the event loop</text><text x="626.0" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">one thread, serving</text><text x="626.0" y="124" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">every request</text><line x1="468" y1="86" x2="536" y2="102" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="468" y1="148" x2="536" y2="102" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="468" y1="210" x2="536" y2="102" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="468" y1="272" x2="536" y2="102" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="536" y="186" width="180" height="56" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="626.0" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">throughput</text><text x="626.0" y="224" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">sees it: 43.6x apart</text><rect x="536" y="262" width="180" height="56" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="626.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">loop lag</text><text x="626.0" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">sees it: 3144ms vs 1ms</text><rect x="536" y="338" width="180" height="56" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="626.0" y="358" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">handler timer</text><text x="626.0" y="376" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">blind: 53ms of 573ms</text><line x1="626" y1="132" x2="626" y2="186" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="778" y="186" width="158" height="132" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="857.0" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">three readings|of one failure</text><text x="857.0" y="224" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">two name it,</text><text x="857.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">one reports</text><text x="857.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">business as usual</text><line x1="716" y1="214" x2="778" y2="252" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="716" y1="290" x2="778" y2="252" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="716" y1="366" x2="778" y2="252" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="130" y="420" width="700" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="480.0" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">run alone, all four cost the same; only concurrency separates them</text><text x="480.0" y="458" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">which is why the broken one passes review, passes a local test, and fails in production</text><line x1="857" y1="318" x2="700" y2="420" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="365" y1="310" x2="420" y2="420" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/></svg>
